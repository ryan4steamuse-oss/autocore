<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GarageIQ — Vehicle Management</title>
<style>
  :root {
    --bg: #0d0d0d; --surface: #141414; --card: #1a1a1a; --card2: #202020;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0ede8; --muted: #888580;
    --accent: #e8593c; --accent2: #f07a5a; --accent-bg: rgba(232,89,60,0.1); --accent-border: rgba(232,89,60,0.3);
    --blue: #2a78d6; --green: #1baf7a; --amber: #eda100;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
  .main { margin-left: 250px; flex: 1; padding: 28px; min-height: 100vh; max-width: 1200px; }
  .logo { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo-text span { color: var(--accent); }
  .logo-sub { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 0.5px; text-transform: uppercase; }
  .nav { padding: 12px 8px; flex: 1; overflow-y: auto; }
  .nav-section { margin-bottom: 20px; }
  .nav-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 0 12px; margin-bottom: 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: var(--accent); color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; }
  .car-selector { padding: 12px 8px; border-bottom: 1px solid var(--border); max-height: 220px; overflow-y: auto; }
  .car-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s; }
  .car-item:hover { background: rgba(255,255,255,0.04); }
  .car-item.active { background: rgba(255,255,255,0.06); border: 1px solid var(--border2); }
  .car-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .car-info { flex: 1; min-width: 0; }
  .car-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .car-plate { font-size: 10px; color: var(--muted); }
  .car-score { font-size: 11px; font-weight: 700; }
  .add-car-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--muted); font-size: 12px; border: 1px dashed var(--border2); margin: 6px 2px 0; transition: all 0.15s; background: none; width: 100%; }
  .add-car-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  .page { display: none; }
  .page.active { display: block; }
  .page-header { margin-bottom: 24px; }
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-4{grid-template-columns:repeat(2,1fr)} .grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr} }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 20px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-size: 24px; font-weight: 700; letter-spacing: -1px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .health-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .health-ring { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
  .health-ring svg { transform: rotate(-90deg); }
  .health-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 800; }
  .health-details { flex: 1; min-width: 220px; }
  .health-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .health-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .health-bars { display: flex; flex-direction: column; gap: 8px; }
  .health-bar-row { display: flex; align-items: center; gap: 10px; }
  .health-bar-label { font-size: 12px; color: var(--muted); width: 80px; }
  .health-bar-track { flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .health-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
  .health-bar-pct { font-size: 11px; font-weight: 600; width: 32px; text-align: right; }
  .service-list { display: flex; flex-direction: column; gap: 10px; }
  .service-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card2); border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .service-item.overdue { border-color: rgba(232,89,60,0.3); background: rgba(232,89,60,0.05); }
  .service-item.due-soon { border-color: rgba(237,161,0,0.3); background: rgba(237,161,0,0.05); }
  .service-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .service-content { flex: 1; min-width: 0; }
  .service-name { font-size: 13px; font-weight: 600; }
  .service-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .service-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
  .badge-ok { background: rgba(27,175,122,0.15); color: var(--green); }
  .badge-soon { background: rgba(237,161,0,0.15); color: var(--amber); }
  .badge-due { background: rgba(232,89,60,0.15); color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: none; text-decoration: none; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border2); }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .section-title { font-size: 14px; font-weight: 700; }
  .section-link { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; }
  .section-link:hover { text-decoration: underline; }
  .alert { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .alert-danger { background: rgba(232,89,60,0.1); border: 1px solid rgba(232,89,60,0.25); }
  .alert-warning { background: rgba(237,161,0,0.1); border: 1px solid rgba(237,161,0,0.25); }
  .alert-info { background: rgba(42,120,214,0.1); border: 1px solid rgba(42,120,214,0.25); }
  .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .alert-text { font-size: 13px; }
  .alert-text strong { display: block; font-weight: 700; margin-bottom: 2px; }
  .alert-text span { color: var(--muted); }
  .cost-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cost-row:last-child { border-bottom: none; }
  .cost-label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .cost-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .cost-val { font-size: 13px; font-weight: 600; }
  .cost-total { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; margin-top: 4px; border-top: 2px solid var(--border2); }
  .cost-total-label { font-size: 14px; font-weight: 700; }
  .cost-total-val { font-size: 18px; font-weight: 800; color: var(--accent); }
  .progress-track { height: 6px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input { width: 100%; padding: 10px 16px 10px 38px; background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; outline: none; }
  .search-input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  .vin-input { width: 100%; padding: 14px 16px; background: var(--card2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; font-family: 'Courier New', monospace; letter-spacing: 2px; text-transform: uppercase; outline: none; }
  .vin-input:focus { border-color: var(--accent); }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 10px 14px; background: var(--card2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
  .form-input:focus { border-color: var(--accent); }
  select.form-input { cursor: pointer; }
  .tabs { display: flex; gap: 4px; background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 20px; width: fit-content; flex-wrap: wrap; }
  .tab { padding: 7px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.15s; border: none; background: none; }
  .tab.active { background: var(--accent); color: white; }
  .mb-8 { margin-bottom: 8px; } .mb-12{margin-bottom:12px} .mb-16 { margin-bottom: 16px; } .mb-20 { margin-bottom: 20px; } .mb-24 { margin-bottom: 24px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; opacity: 0.75; min-height: 4px; }
  .bar-label { font-size: 10px; color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 5px; font-weight: 600; }
  .tag-accent { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
  .value-bar { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--green), var(--amber), var(--accent)); margin: 10px 0; position: relative; }
  .value-indicator { position: absolute; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: white; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--blue); transform: translateX(-50%); transition: left 0.4s; }
  .value-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .modal-overlay { display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 26px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-title { font-size: 17px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; }
  .toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--card2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); animation: slideIn 0.2s ease; max-width: 320px; }
  .toast.success { border-color: rgba(27,175,122,0.4); }
  .toast.error { border-color: rgba(232,89,60,0.4); }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .link-list { display: flex; flex-direction: column; gap: 8px; }
  .link-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); text-decoration: none; color: var(--text); transition: border-color .15s; }
  .link-row:hover { border-color: var(--accent-border); }
  .diy-card { background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; margin-bottom: 12px; cursor: pointer; }
  .diy-card:hover { border-color: var(--accent-border); }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 6px; }
  .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  small.hint { color: var(--muted); font-size: 11px; display:block; margin-top: 4px; }
  textarea.form-input { resize: vertical; font-family: inherit; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-text">Garage<span>IQ</span></div>
      <div class="logo-sub">Vehicle Management</div>
    </div>
    <div class="car-selector" id="car-selector"></div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Overview</div>
        <button class="nav-item" data-page="dashboard" onclick="showPage('dashboard')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-page="profile" onclick="showPage('profile')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Vehicle Profile
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Maintenance</div>
        <button class="nav-item" data-page="maintenance" onclick="showPage('maintenance')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Service Tracker
          <span class="nav-badge" id="nav-badge-maint" style="display:none">0</span>
        </button>
        <button class="nav-item" data-page="diy" onclick="showPage('diy')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
          DIY Assistant
        </button>
        <button class="nav-item" data-page="fuel" onclick="showPage('fuel')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 22V7l9-4 9 4v15M3 11h18M3 16h18M7 22v-4h4v4M13 22v-4h4v4"/></svg>
          Fuel Log
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Tools</div>
        <button class="nav-item" data-page="mods" onclick="showPage('mods')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Modifications
        </button>
        <button class="nav-item" data-page="mechanics" onclick="showPage('mechanics')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Find Mechanics
        </button>
        <button class="nav-item" data-page="value" onclick="showPage('value')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          Car Value
        </button>
        <button class="nav-item" data-page="theft" onclick="showPage('theft')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Security
        </button>
      </div>
    </nav>
    <div class="sidebar-footer">Data is saved automatically to your browser account.</div>
  </aside>

  <main class="main">
    <div class="page" id="page-dashboard"></div>
    <div class="page" id="page-profile"></div>
    <div class="page" id="page-maintenance"></div>
    <div class="page" id="page-diy"></div>
    <div class="page" id="page-fuel"></div>
    <div class="page" id="page-mods"></div>
    <div class="page" id="page-mechanics"></div>
    <div class="page" id="page-value"></div>
    <div class="page" id="page-theft"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay"><div class="modal-box" id="modal-box"></div></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* ============================= CONSTANTS ============================= */
const STORAGE_KEY = 'garageiq-state-v1';

const SERVICE_INTERVALS = [
  {key:'oil', name:'Oil & Filter Change', km:10000, months:12, icon:'🛢️', costMin:75, costMax:150},
  {key:'tyre_rotation', name:'Tyre Rotation', km:10000, months:6, icon:'🔄', costMin:40, costMax:70},
  {key:'cabin_filter', name:'Cabin Air Filter', km:20000, months:12, icon:'❄️', costMin:20, costMax:45},
  {key:'air_filter', name:'Engine Air Filter', km:30000, months:24, icon:'💨', costMin:20, costMax:45},
  {key:'brake_fluid', name:'Brake Fluid Flush', km:40000, months:24, icon:'🩸', costMin:80, costMax:150},
  {key:'coolant', name:'Coolant Flush', km:60000, months:48, icon:'🌡️', costMin:120, costMax:220},
  {key:'spark_plugs', name:'Spark Plugs', km:60000, months:60, icon:'⚡', costMin:150, costMax:350},
  {key:'transmission', name:'Transmission Service', km:80000, months:60, icon:'⚙️', costMin:200, costMax:450},
  {key:'battery', name:'Battery', km:100000, months:48, icon:'🔋', costMin:150, costMax:300},
  {key:'timing_belt', name:'Timing Belt', km:100000, months:84, icon:'⏱️', costMin:600, costMax:1200},
  {key:'brake_pads', name:'Brake Pads', km:50000, months:36, icon:'🛑', costMin:150, costMax:350},
];

const HEALTH_BUCKETS = {
  Engine: ['oil','air_filter','spark_plugs','timing_belt','coolant'],
  Brakes: ['brake_fluid','brake_pads'],
  Tyres: ['tyre_rotation'],
  Electrical: ['battery'],
  Filters: ['cabin_filter']
};

// Base "as new" MSRP estimates (AUD) used ONLY for the depreciation-model value calculator.
// These are approximate anchor points, not live pricing.
const BASE_MSRP = {
  'toyota camry':42000,'toyota corolla':28000,'toyota rav4':38000,'toyota hilux':45000,'toyota landcruiser':90000,

/* ============================= COMPUTED LOGIC ============================= */
function getServiceStatus(vehicle){
  return SERVICE_INTERVALS.map(interval=>{
    const past = vehicle.services.filter(s=>s.type===interval.key).sort((a,b)=> b.odometer-a.odometer);
    const last = past[0];
    let dueKm, dueDate;
    if(last){
      dueKm = last.odometer + interval.km;
      dueDate = addMonths(last.date, interval.months);
    } else {
      dueKm = interval.km;
      dueDate = addMonths(vehicle.purchaseDate || vehicle.odometerDate || today(), interval.months);
    }
    const kmRemaining = dueKm - vehicle.odometer;
    const daysRemaining = daysBetween(today(), dueDate);
    let status = 'ok';
    if(kmRemaining <= 0 || daysRemaining <= 0) status = 'overdue';
    else if(kmRemaining <= 1000 || daysRemaining <= 30) status = 'soon';
    return {...interval, last, dueKm, kmRemaining, dueDate, daysRemaining, status};
  }).sort((a,b)=>{
    const rank = {overdue:0, soon:1, ok:2};
    return rank[a.status]-rank[b.status] || a.kmRemaining-b.kmRemaining;
  });
}

function computeHealth(vehicle){
  const statuses = getServiceStatus(vehicle);
  const byKey = Object.fromEntries(statuses.map(s=>[s.key,s]));
  const bucketScores = {};
  Object.entries(HEALTH_BUCKETS).forEach(([bucket, keys])=>{
    const scores = keys.map(k=>{
      const s = byKey[k];
      if(!s) return 100;
      if(s.status==='ok') return 100;
      if(s.status==='soon') return 65;
      return 30;
    });
    bucketScores[bucket] = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  });
  const overall = Math.round(Object.values(bucketScores).reduce((a,b)=>a+b,0)/Object.keys(bucketScores).length);
  return {overall, buckets: bucketScores};
}

function getFuelStats(vehicle){
  const logs = [...vehicle.fuelLogs].sort((a,b)=> a.odometer-b.odometer);
  let consumptions = [];
  for(let i=1;i<logs.length;i++){
    const distance = logs[i].odometer - logs[i-1].odometer;
    if(distance>0){
      const l100 = (logs[i].liters/distance)*100;
      consumptions.push({date: logs[i].date, l100km: l100});
    }
  }
  const avgL100 = consumptions.length ? consumptions.reduce((s,c)=>s+c.l100km,0)/consumptions.length : null;
  const totalCost = logs.reduce((s,l)=>s+Number(l.cost||0),0);
  const totalLiters = logs.reduce((s,l)=>s+Number(l.liters||0),0);
  const totalDistance = logs.length>1 ? logs[logs.length-1].odometer - logs[0].odometer : 0;
  const costPerKm = totalDistance>0 ? totalCost/totalDistance : null;
  const monthly = {};
  logs.forEach(l=>{ const m = (l.date||'').slice(0,7); if(!m) return; monthly[m] = (monthly[m]||0) + Number(l.cost||0); });
  return {avgL100, totalCost, totalLiters, costPerKm, consumptions, monthly, logs};
}

function getAnnualKm(vehicle){
  if(vehicle.purchaseDate && vehicle.purchaseOdometer!=null){
    const years = daysBetween(vehicle.purchaseDate, today())/365;
    if(years > 0.05){
      return (vehicle.odometer - vehicle.purchaseOdometer)/years;
    }
  }
  const logs = [...vehicle.fuelLogs].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(logs.length>1){
    const days = daysBetween(logs[0].date, logs[logs.length-1].date);
    const dist = logs[logs.length-1].odometer - logs[0].odometer;
    if(days>0) return dist/(days/365);
  }
  return null;
}

function getAnnualCost(vehicle){
  const fuel = getFuelStats(vehicle);
  const annualKm = getAnnualKm(vehicle);
  const fuelAnnual = annualKm && fuel.costPerKm ? fuel.costPerKm * annualKm : fuel.totalCost;
  const svcTotal = vehicle.services.reduce((s,x)=>s+Number(x.cost||0),0);
  const svcSpan = vehicle.services.length ? Math.max(daysBetween(vehicle.services.reduce((min,s)=> s.date<min?s.date:min, vehicle.services[0].date), today())/365, 0.25) : 1;
  const maintAnnual = vehicle.services.length ? svcTotal/svcSpan : 0;
  return { fuelAnnual, maintAnnual, total: fuelAnnual + maintAnnual };
}

/* ============================= VIN DECODE (real NHTSA vPIC API) ============================= */
async function decodeVin(vin){
  vin = (vin||'').trim().toUpperCase();
  if(vin.length < 10 || vin.length > 17){
    return {error: 'A VIN should be 11–17 characters. Please check and try again.'};
  }
  try {
    const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${encodeURIComponent(vin)}?format=json`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const r = data.Results && data.Results[0];
    if(!r) return {error: 'No data returned for this VIN.'};
    if(!r.Make && !r.Model){
      return {error: (r.ErrorText && r.ErrorText !== '0 - VIN decoded clean. Check Digit (9th position) is correct') ? r.ErrorText : 'This VIN could not be decoded — it may be invalid or for a market outside the US database.'};
    }
    const engineParts = [];
    if(r.EngineCylinders) engineParts.push(r.EngineCylinders + '-cyl');
    if(r.DisplacementL) engineParts.push(parseFloat(r.DisplacementL).toFixed(1) + 'L');
    if(r.EngineHP) engineParts.push(r.EngineHP + 'hp');
    const transParts = [];
    if(r.TransmissionSpeeds) transParts.push(r.TransmissionSpeeds + '-spd');
    if(r.TransmissionStyle) transParts.push(r.TransmissionStyle);
    return {
      make: r.Make || '', model: r.Model || '', year: r.ModelYear || '', trim: r.Trim || r.Series || '',
      engine: engineParts.join(' ') || '', transmission: transParts.join(' ') || '',
      drivetrain: r.DriveType || '', fuelType: r.FuelTypePrimary || '', bodyClass: r.BodyClass || '',
      plantCountry: r.PlantCountry || '', plantCity: r.PlantCity || '', manufacturer: r.Manufacturer || '',
      doors: r.Doors || ''
    };
  } catch(e){
    return {error: 'Could not reach the NHTSA VIN decoding service right now (network issue). You can still enter details manually below. [' + e.message + ']'};
  }
}

function profileField(label, value){
  return `<div style="padding:8px 0"><div class="form-label" style="margin-bottom:2px">${label}</div><div style="font-size:13px;font-weight:600">${escapeHtml(value)||'<span style="color:var(--muted);font-weight:400">Not set</span>'}</div></div>`;
}
function renderDocuments(v){
  if(!v.documents.length) return `<div style="color:var(--muted);font-size:13px;padding:20px 0;text-align:center">No documents uploaded yet.</div>`;
  return `<div class="service-list">` + v.documents.map(d=>`
    <div class="service-item">
      <div class="service-icon" style="background:rgba(42,120,214,0.1)">📄</div>
      <div class="service-content"><div class="service-name">${escapeHtml(d.name)}</div><div class="service-detail">Uploaded ${fmtDate(d.date)}</div></div>
      <a href="${d.dataUrl}" download="${escapeHtml(d.name)}" class="icon-btn" title="Download">⬇️</a>
      <button class="icon-btn" onclick="deleteDocument('${v.id}','${d.id}')" title="Delete">🗑️</button>
    </div>`).join('') + `</div>`;
}
function handleDocUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 1.5*1024*1024){ showToast('⚠️ File too large — please keep under 1.5MB', 'error'); return; }
  const reader = new FileReader();
  reader.onload = async function(ev){
    const v = getSelected();
    v.documents.push({id: uid('doc'), name: file.name, dataUrl: ev.target.result, date: today()});
    await saveState(true);
    renderProfile(v);
    showToast('✓ Document uploaded', 'success');
  };
  reader.onerror = function(){ showToast('⚠️ Could not read file', 'error'); };
  reader.readAsDataURL(file);
}
async function deleteDocument(vid, did){
  const v = getVehicle(vid);
  v.documents = v.documents.filter(d=>d.id!==did);
  await saveState(true);
  renderProfile(v);
}

/* ============================= DIY ASSISTANT ============================= */
function searchDiy(query){
  query = (query||'').toLowerCase().trim();
  if(!query) return [];
  const words = query.split(/\s+/).filter(w=>w.length>2);
  const scored = DIY_GUIDES.map(g=>{
    let score=0;
    g.keywords.forEach(k=>{ if(query.includes(k)) score += k.split(' ').length*3; });
    words.forEach(w=>{ if(g.keywords.some(k=>k.includes(w))) score += 1; if(g.title.toLowerCase().includes(w)) score += 1; });
    return {g, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.map(x=>x.g);
}
function renderDiy(v){
  $('#page-diy').innerHTML = `
    <div class="page-header"><div class="page-title">DIY Assistant</div><div class="page-sub">Search real, general guidance for common issues</div></div>

      <input class="search-input" id="diy-search" placeholder='Describe your issue — e.g. "brake squeak", "wont start", "rough idle"' oninput="renderDiyResults(this.value)">
    </div>
    <div id="diy-results"></div>
    <div id="diy-detail"></div>
  `;
  renderDiyResults('');
}
function renderDiyResults(query){
  const box = $('#diy-results');
  const detail = $('#diy-detail');
  detail.innerHTML = '';
  if(!query.trim()){
    box.innerHTML = `<div class="section-title mb-12">Browse common guides</div>` + DIY_GUIDES.map(g=>diyCardHtml(g)).join('');

function stationBreakdown(v){
  const byStation = {};
  v.fuelLogs.forEach(l=>{ const key = l.station||'Unknown'; if(!byStation[key]) byStation[key]={count:0, totalPerL:0, n:0}; byStation[key].count++; if(l.liters>0){ byStation[key].totalPerL += (l.cost/l.liters); byStation[key].n++; } });
  const rows = Object.entries(byStation).map(([name,d])=>({name, avgPrice: d.n? d.totalPerL/d.n : null, count:d.count})).sort((a,b)=> (a.avgPrice||99)-(b.avgPrice||99));
  if(!rows.length) return '<div style="color:var(--muted);font-size:13px">No data yet</div>';
  return rows.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-size:13px">${escapeHtml(r.name)} <span style="color:var(--muted);font-size:11px">(${r.count})</span></div><div style="font-size:13px;font-weight:700">${r.avgPrice?'$'+r.avgPrice.toFixed(2)+'/L':'—'}</div></div>`).join('');
}
async function deleteFuel(vid, fid){
  const v = getVehicle(vid);
  v.fuelLogs = v.fuelLogs.filter(f=>f.id!==fid);
  await saveState(true);
  renderAll();
  showToast('Fill-up deleted', 'success');
}

/* ============================= CAR VALUE ============================= */
function estimateValue(v, condition, accidents, mods){
  const key = `${(v.make||'').toLowerCase()} ${(v.model||'').toLowerCase()}`.trim();
  let base = DEFAULT_MSRP;
  for(const k in BASE_MSRP){ if(key.includes(k)) { base = BASE_MSRP[k]; break; } }
  const year = parseInt(v.year) || new Date().getFullYear()-5;
  const age = Math.max(new Date().getFullYear() - year, 0);
  let value = base * Math.pow(0.85, age);
  const expectedKm = age * 15000;
  const kmDiff = (v.odometer||0) - expectedKm;
  value -= kmDiff * 0.08;
  const condMult = {excellent:1.05, good:1.0, fair:0.9, poor:0.75}[condition] ?? 1.0;
  value *= condMult;
  const accMult = {none:1.0, minor:0.92, major:0.8}[accidents] ?? 1.0;
  value *= accMult;
  const modMult = {stock:1.0, minor:0.97, heavy:0.9}[mods] ?? 1.0;
  value *= modMult;
  value = Math.max(value, 1500);
  return {min: value*0.9, mid: value, max: value*1.1, base, age};
}

  $('#veh-year').value = result.year;
  $('#veh-trim').value = result.trim;
  $('#veh-engine').value = result.engine;
  $('#veh-transmission').value = result.transmission;
  $('#veh-drivetrain').value = result.drivetrain;
  $('#veh-fueltype').value = result.fuelType;
  lastVinExtra = {bodyClass: result.bodyClass, plantCountry: result.plantCountry, plantCity: result.plantCity, manufacturer: result.manufacturer};
  status.innerHTML = `<span style="color:var(--green)">✓ Decoded successfully from the official US NHTSA VIN database (make/model/year/engine confirmed).</span>`;
}
async function saveVehicle(editId){
  const data = {
    vin: $('#veh-vin').value.trim(), make: $('#veh-make').value.trim(), model: $('#veh-model').value.trim(),
    year: $('#veh-year').value.trim(), trim: $('#veh-trim').value.trim(), engine: $('#veh-engine').value.trim(),
    transmission: $('#veh-transmission').value.trim(), drivetrain: $('#veh-drivetrain').value.trim(),
    fuelType: $('#veh-fueltype').value.trim(), color: $('#veh-color').value.trim(), plate: $('#veh-plate').value.trim(),
    regState: $('#veh-regstate').value, odometer: parseFloat($('#veh-odometer').value)||0,
    purchaseDate: $('#veh-purchasedate').value || null, purchaseOdometer: $('#veh-purchaseodo').value!=='' ? parseFloat($('#veh-purchaseodo').value) : null,
    odometerDate: today()
  };
  if(!data.make || !data.model){ showToast('⚠️ Please enter at least make and model', 'error'); return; }
  Object.assign(data, lastVinExtra);
  if(editId){
    const v = getVehicle(editId);
    Object.assign(v, data);
  } else {
    const v = {...data, id: uid('veh'), bodyClass: data.bodyClass||'', plantCountry: data.plantCountry||'', plantCity: data.plantCity||'', manufacturer: data.manufacturer||'', services:[], fuelLogs:[], documents:[]};
    appState.vehicles.push(v);
    appState.selectedId = v.id;
  }
  await saveState(true);
  closeModal();
  renderAll();
  showToast('✓ Vehicle saved', 'success');
}
async function deleteVehicle(id){
  if(!confirm('Delete this vehicle and all its records? This cannot be undone.')) return;
  appState.vehicles = appState.vehicles.filter(v=>v.id!==id);
  if(appState.selectedId===id){ appState.selectedId = appState.vehicles.length ? appState.vehicles[0].id : null; }
  await saveState(true);
  currentPage = 'dashboard';
  renderAll();
  showToast('Vehicle deleted', 'success');
}

/* ============================= MODALS: SERVICE / FUEL ============================= */
function openServiceModal(prefillType){
  const v = getSelected();
  $('#modal-box').innerHTML = `
    <div class="modal-head"><div class="modal-title">Log Service</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="form-group"><label class="form-label">Service Type</label>
      <select class="form-input" id="svc-type">
        ${SERVICE_INTERVALS.map(s=>`<option value="${s.key}" ${prefillType===s.key?'selected':''}>${s.name}</option>`).join('')}
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group" id="svc-other-wrap" style="display:none"><label class="form-label">Describe Service</label><input class="form-input" id="svc-other-name" placeholder="e.g. Wheel alignment"></div>
    <div class="grid-2" style="gap:0 16px">
      <div class="form-group"><label class="form-label">Odometer (km)</label><input class="form-input" id="svc-odo" value="${v.odometer}"></div>
      <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="svc-date" value="${today()}"></div>
    </div>
    <div class="form-group"><label class="form-label">Workshop / Location</label><input class="form-input" id="svc-shop" placeholder="e.g. VicAuto Fitzroy"></div>
    <div class="form-group"><label class="form-label">Cost ($)</label><input class="form-input" id="svc-cost" placeholder="e.g. 120"></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" rows="2" id="svc-notes" placeholder="Any additional notes..."></textarea></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-primary" style="flex:1" onclick="saveService('${v.id}')">Save Service</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  `;
  $('#svc-type').addEventListener('change', e=>{ $('#svc-other-wrap').style.display = e.target.value==='other' ? 'block':'none'; });
  if(prefillType==='other') $('#svc-other-wrap').style.display='block';
  openModal();
}
async function saveService(vid){
  const v = getVehicle(vid);
  const typeKey = $('#svc-type').value;
  const interval = SERVICE_INTERVALS.find(s=>s.key===typeKey);
  const typeName = typeKey==='other' ? ($('#svc-other-name').value.trim() || 'Other Service') : interval.name;
  const odo = parseFloat($('#svc-odo').value);
  const date = $('#svc-date').value;
  if(!odo || !date){ showToast('⚠️ Odometer and date are required', 'error'); return; }
  v.services.push({id: uid('svc'), type: typeKey, typeName, date, odometer: odo, cost: parseFloat($('#svc-cost').value)||0, shop: $('#svc-shop').value.trim(), notes: $('#svc-notes').value.trim()});
  if(odo > v.odometer){ v.odometer = odo; v.odometerDate = date; }
  await saveState(true);
  closeModal();
  renderAll();
  showToast('✓ Service logged', 'success');
}
function openFuelModal(){
  const v = getSelected();
  $('#modal-box').innerHTML = `
    <div class="modal-head"><div class="modal-title">Add Fill-up</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="grid-2" style="gap:0 16px">
      <div class="form-group"><label class="form-label">Odometer (km)</label><input class="form-input" id="fuel-odo" value="${v.odometer}"></div>
      <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="fuel-date" value="${today()}"></div>
    </div>
    <div class="grid-2" style="gap:0 16px">
      <div class="form-group"><label class="form-label">Litres</label><input class="form-input" id="fuel-liters" placeholder="e.g. 42"></div>
      <div class="form-group"><label class="form-label">Total Cost ($)</label><input class="form-input" id="fuel-cost" placeholder="e.g. 73.50"></div>
    </div>
    <div class="form-group"><label class="form-label">Station</label><input class="form-input" id="fuel-station" placeholder="e.g. Shell Fitzroy"></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-primary" style="flex:1" onclick="saveFuel('${v.id}')">Save Fill-up</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  `;
  openModal();
}
async function saveFuel(vid){
  const v = getVehicle(vid);
  const odo = parseFloat($('#fuel-odo').value);
  const liters = parseFloat($('#fuel-liters').value);
  const cost = parseFloat($('#fuel-cost').value);
  const date = $('#fuel-date').value;
  if(!odo || !liters || !cost || !date){ showToast('⚠️ Please fill in odometer, litres, cost and date', 'error'); return; }
  v.fuelLogs.push({id: uid('fuel'), date, odometer: odo, liters, cost, station: $('#fuel-station').value.trim()});
  if(odo > v.odometer){ v.odometer = odo; v.odometerDate = date; }
  await saveState(true);
  closeModal();
  renderAll();
  showToast('✓ Fill-up logged', 'success');
}

/* ============================= MODAL HELPERS ============================= */
function openModal(){ $('#modal-overlay').classList.add('open'); }
function closeModal(){ $('#modal-overlay').classList.remove('open'); }
$('#modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });

/* ============================= CSV EXPORT ============================= */
function exportCsv(type){
  const v = getSelected();
  let rows, filename;
  if(type==='services'){
    rows = [['Date','Type','Odometer(km)','Cost','Shop','Notes']];
    v.services.forEach(s=> rows.push([s.date, s.typeName, s.odometer, s.cost, s.shop, s.notes]));
    filename = `${v.make}_${v.model}_services.csv`;
  } else {
    rows = [['Date','Odometer(km)','Litres','Cost','Station']];
    v.fuelLogs.forEach(f=> rows.push([f.date, f.odometer, f.liters, f.cost, f.station]));
    filename = `${v.make}_${v.model}_fuel.csv`;
  }
  const csv = rows.map(r=> r.map(c=> `"${(c??'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ CSV downloaded', 'success');
}

/* ============================= INIT ============================= */
loadState();
showPage('dashboard');
</script>
