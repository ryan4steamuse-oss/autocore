<script>
// Apply the saved theme before first paint so there's no flash of the wrong theme.
(function(){
  try {
    var raw = localStorage.getItem('autocore-prefs-v1');
    var theme = 'midnight';
    if(raw){ var p = JSON.parse(raw); if(p && p.settings && p.settings.theme) theme = p.settings.theme; }
    document.documentElement.setAttribute('data-theme', theme);
  } catch(e){}
})();
</script>

      </div>
      <div class="auth-foot">Your vehicles sync to your account, so you can pick up from any device.</div>

  `;

async function handleAuthSubmit(mode){
  const email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  const statusEl = $('#auth-status');
  if(!email || !password){ statusEl.style.color = 'var(--accent)'; statusEl.textContent = 'Enter an email and password.'; return; }
  const btn = $('#auth-submit-btn');
  btn.disabled = true; btn.textContent = mode==='signup' ? 'Creating account…' : 'Signing in…';
  statusEl.style.color = 'var(--muted)'; statusEl.textContent = '';
  const result = mode==='signup'
    ? await supabase.auth.signUp({ email, password })
    : await supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = mode==='signup' ? 'Create Account' : 'Sign In';
  if(result.error){ statusEl.style.color = 'var(--accent)'; statusEl.textContent = result.error.message; return; }
  if(mode==='signup' && result.data.user && !result.data.session){
    statusEl.style.color = 'var(--green)';
    statusEl.textContent = 'Account created — check your email to confirm, then sign in.';
    return;
  }
  // On success, onAuthStateChange fires and enters the app.
}

/* ============================= CLOUD STORAGE (Supabase) ============================= */
async function loadState(){
  const prefs = loadLocalPrefs();
  appState.selectedId = prefs.selectedId || null;
  appState.userLocation = prefs.userLocation || null;
  appState.settings = Object.assign({theme:'midnight', unit:'km', currency:'AUD'}, prefs.settings || {});
  applyTheme(appState.settings.theme);

  try {
    const { data, error } = await supabase
      .from('user_settings')
      .select('theme, unit, currency')
      .eq('user_id', currentUser.id)
      .maybeSingle();
    if(error) throw error;
    if(data){
      appState.settings = { theme: data.theme, unit: data.unit, currency: data.currency };
      applyTheme(appState.settings.theme);
      saveLocalPrefs();
    } else {
      // First time this account has signed in: seed the cloud row from whatever's on this device.
      saveSettingsToCloud();
    }
  } catch(e){
    console.error('Failed to load settings', e);
    showToast('⚠️ Could not load your synced settings (' + (e.message||'unknown error') + ')', 'error');
  }

  appState.vehicles = [];
  try {
    const { data, error } = await supabase
      .from('vehicles')
      .select('id, data, created_at')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });
    if(error) throw error;
    appState.vehicles = (data||[]).map(row => ({
      ...(row.data||{}),
      id: row.id,

/* ============================= COMPUTED LOGIC ============================= */
function getServiceStatus(vehicle){
  return SERVICE_INTERVALS.map(interval=>{
    const past = vehicle.services.filter(s=>s.type===interval.key).sort((a,b)=> b.odometer-a.odometer);
    const last = past[0];
    let dueKm, dueDate;
    if(last){
      dueKm = last.odometer + interval.km;
      dueDate = addMonths(last.date, interval.months);
    } else {
      dueKm = interval.km;
      dueDate = addMonths(vehicle.purchaseDate || vehicle.odometerDate || today(), interval.months);
    }
    const kmRemaining = dueKm - vehicle.odometer;
    const daysRemaining = daysBetween(today(), dueDate);
    let status = 'ok';
    if(kmRemaining <= 0 || daysRemaining <= 0) status = 'overdue';
    else if(kmRemaining <= 1000 || daysRemaining <= 30) status = 'soon';
    return {...interval, last, dueKm, kmRemaining, dueDate, daysRemaining, status};
  }).sort((a,b)=>{
    const rank = {overdue:0, soon:1, ok:2};
    return rank[a.status]-rank[b.status] || a.kmRemaining-b.kmRemaining;
  });
}

function computeHealth(vehicle){
  const statuses = getServiceStatus(vehicle);
  const byKey = Object.fromEntries(statuses.map(s=>[s.key,s]));
  const bucketScores = {};
  Object.entries(HEALTH_BUCKETS).forEach(([bucket, keys])=>{
    const scores = keys.map(k=>{
      const s = byKey[k];
      if(!s) return 100;
      if(s.status==='ok') return 100;
      if(s.status==='soon') return 65;
      return 30;
    });
    bucketScores[bucket] = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  });
  const overall = Math.round(Object.values(bucketScores).reduce((a,b)=>a+b,0)/Object.keys(bucketScores).length);
  return {overall, buckets: bucketScores};
}

function getAnnualKm(vehicle){
  if(vehicle.purchaseDate && vehicle.purchaseOdometer!=null){
    const years = daysBetween(vehicle.purchaseDate, today())/365;
    if(years > 0.05){
      return (vehicle.odometer - vehicle.purchaseOdometer)/years;
    }
  }
  return null;
}

function getAnnualCost(vehicle){
  const svcTotal = vehicle.services.reduce((s,x)=>s+Number(x.cost||0),0);
  const svcSpan = vehicle.services.length ? Math.max(daysBetween(vehicle.services.reduce((min,s)=> s.date<min?s.date:min, vehicle.services[0].date), today())/365, 0.25) : 1;
  const maintAnnual = vehicle.services.length ? svcTotal/svcSpan : 0;
  return { maintAnnual, total: maintAnnual };
}

/* ============================= VIN DECODE (real NHTSA vPIC API) ============================= */
async function decodeVin(vin){
  vin = (vin||'').trim().toUpperCase();
  if(vin.length < 10 || vin.length > 17){
    return {error: 'A VIN should be 11–17 characters. Please check and try again.'};
  }
  try {
    const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${encodeURIComponent(vin)}?format=json`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const r = data.Results && data.Results[0];
    if(!r) return {error: 'No data returned for this VIN.'};
    if(!r.Make && !r.Model){
      return {error: (r.ErrorText && r.ErrorText !== '0 - VIN decoded clean. Check Digit (9th position) is correct') ? r.ErrorText : 'This VIN could not be decoded — it may be invalid or for a market outside the US database.'};
    }
    const engineParts = [];
    if(r.EngineCylinders) engineParts.push(r.EngineCylinders + '-cyl');
    if(r.DisplacementL) engineParts.push(parseFloat(r.DisplacementL).toFixed(1) + 'L');
    if(r.EngineHP) engineParts.push(r.EngineHP + 'hp');
    const transParts = [];
    if(r.TransmissionSpeeds) transParts.push(r.TransmissionSpeeds + '-spd');
    if(r.TransmissionStyle) transParts.push(r.TransmissionStyle);
    return {
      make: r.Make || '', model: r.Model || '', year: r.ModelYear || '', trim: r.Trim || r.Series || '',
      engine: engineParts.join(' ') || '', transmission: transParts.join(' ') || '',
      drivetrain: r.DriveType || '', fuelType: r.FuelTypePrimary || '', bodyClass: r.BodyClass || '',
      plantCountry: r.PlantCountry || '', plantCity: r.PlantCity || '', manufacturer: r.Manufacturer || '',
      doors: r.Doors || ''
    };
  } catch(e){
    return {error: 'Could not reach the NHTSA VIN decoding service right now (network issue). You can still enter details manually below. [' + e.message + ']'};
  }
}

/* ============================= CAR PHOTO (Wikimedia Commons) ============================= */
const carPhotoCache = {};
async function loadCarPhoto(v){
  const wrap = $('#car-photo-wrap');
  if(!wrap) return;
  const make = (v.make||'').trim(), model = (v.model||'').trim(), year = (v.year||'').toString().trim();
  if(!make || !model){
    wrap.innerHTML = `<div style="padding:40px 0">🚗</div>`;
    return;
  }
  const cacheKey = `${year}|${make}|${model}`.toLowerCase();
  if(carPhotoCache[cacheKey] !== undefined){
    renderCarPhoto(wrap, carPhotoCache[cacheKey]);
    return;
  }
  wrap.innerHTML = `<div>Loading photo…</div>`;
  const queries = [
    `${year} ${make} ${model}`.trim(),
    `${make} ${model}`.trim()
  ];
  let url = null;
  for(const q of queries){
    url = await searchCommonsImage(q);
    if(url) break;
  }
  carPhotoCache[cacheKey] = url;
  // Only paint the result if the user is still looking at this same vehicle's page.
  const current = getSelected();
  if(current && current.id === v.id && $('#car-photo-wrap')){
    renderCarPhoto($('#car-photo-wrap'), url);
  }
}
function renderCarPhoto(wrap, url){
  if(url){
    wrap.innerHTML = `<img src="${url}" alt="Reference photo" style="width:100%;max-height:340px;object-fit:contain;border-radius:var(--radius-sm)" onerror="this.parentElement.innerHTML='<div style=&quot;padding:40px 0&quot;>🚗</div>'">`;
  } else {
    wrap.innerHTML = `<div style="padding:40px 0;text-align:center"><div style="font-size:28px;margin-bottom:6px">🚗</div><div>No reference photo found</div></div>`;
  }
}
async function searchCommonsImage(query){
  try {
    const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(query + ' filetype:bitmap')}&gsrlimit=6&prop=imageinfo&iiprop=url|mime&iiurlwidth=800&format=json&origin=*`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const json = await res.json();
    const pages = json && json.query && json.query.pages;
    if(!pages) return null;
    const candidates = Object.values(pages)
      .map(p => p.imageinfo && p.imageinfo[0])
      .filter(info => info && info.mime && info.mime.startsWith('image/') && !info.mime.includes('svg'));
    if(!candidates.length) return null;
    const best = candidates[0];
    return best.thumburl || best.url || null;
  } catch(e){
    console.error('Commons image search failed', e);
    return null;
  }
}
/* ============================= CAR BRIEF (Wikipedia overview + NHTSA-based reliability estimate) ============================= */
const carBriefCache = {};
async function loadCarBrief(v){
  const wrap = $('#car-brief-wrap');
  if(!wrap) return;
  const make = (v.make||'').trim(), model = (v.model||'').trim(), year = (v.year||'').toString().trim();
  if(!make || !model){
    wrap.innerHTML = `<div style="color:var(--muted);font-size:13px">Add a make and model to see a vehicle overview.</div>`;
    return;
  }
  const cacheKey = `${year}|${make}|${model}`.toLowerCase();
  if(carBriefCache[cacheKey] !== undefined){
    renderCarBrief(wrap, carBriefCache[cacheKey]);
    return;
  }
  wrap.innerHTML = `<div style="color:var(--muted);font-size:13px">Loading vehicle overview…</div>`;
  const [summary, recallsCount, complaintsCount] = await Promise.all([
    (async () => (await fetchWikipediaSummary(`${year} ${make} ${model}`.trim())) || (await fetchWikipediaSummary(`${make} ${model}`.trim())))(),
    fetchNhtsaCount('recalls/recallsByVehicle', make, model, year),
    fetchNhtsaCount('complaints/complaintsByVehicle', make, model, year)
  ]);
  const data = { summary, recallsCount, complaintsCount, score: computeReliabilityScore(recallsCount, complaintsCount) };
  carBriefCache[cacheKey] = data;
  // Only paint the result if the user is still looking at this same vehicle's page.
  const current = getSelected();
  if(current && current.id === v.id && $('#car-brief-wrap')){
    renderCarBrief($('#car-brief-wrap'), data);
  }
}
async function fetchWikipediaSummary(query){
  if(!query) return null;
  try {
    const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=extracts|info&exintro=1&explaintext=1&exchars=700&inprop=url&format=json&origin=*`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const json = await res.json();
    const pages = json && json.query && json.query.pages;
    if(!pages) return null;
    const page = Object.values(pages)[0];
    if(!page || !page.extract) return null;
    return { title: page.title, extract: page.extract, url: page.fullurl || null };
  } catch(e){
    console.error('Wikipedia summary fetch failed', e);
    return null;
  }
}
async function fetchNhtsaCount(endpoint, make, model, year){
  if(!make || !model || !year) return null;
  try {
    const url = `https://api.nhtsa.gov/${endpoint}?make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}&modelYear=${encodeURIComponent(year)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const json = await res.json();
    if(typeof json.Count === 'number') return json.Count;
    if(Array.isArray(json.results)) return json.results.length;
    return null;
  } catch(e){
    console.error('NHTSA lookup failed', endpoint, e);
    return null;
  }
}
function computeReliabilityScore(recallsCount, complaintsCount){
  if(recallsCount == null && complaintsCount == null) return null;
  let score = 100;
  score -= Math.min(30, (recallsCount||0) * 4);
  score -= Math.min(45, Math.log((complaintsCount||0) + 1) * 9);
  return Math.round(Math.max(20, Math.min(97, score)));
}
function scoreColor(score){
  if(score >= 75) return 'var(--green)';
  if(score >= 50) return 'var(--amber)';
  return 'var(--accent)';
}
function renderCarBrief(wrap, data){
  const { summary, recallsCount, complaintsCount, score } = data;
  const descHtml = summary
    ? `<p style="font-size:13px;line-height:1.6;margin:0 0 14px">${escapeHtml(summary.extract)}</p>`
    : `<p style="font-size:13px;color:var(--muted);margin:0 0 14px">No overview found for this vehicle online — double check the make, model and year are correct.</p>`;
  const scoreHtml = score != null ? `
    <div style="margin-top:4px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div class="form-label" style="margin-bottom:2px">Estimated Reliability Score</div>
        <div style="font-size:18px;font-weight:800;color:${scoreColor(score)}">${score}<span style="font-size:12px;color:var(--muted);font-weight:600">/100</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${score}%;background:${scoreColor(score)}"></div></div>
      <small class="hint">Estimated from U.S. NHTSA safety recalls (${recallsCount!=null?recallsCount:'—'}) and owner complaints (${complaintsCount!=null?complaintsCount:'—'}) on file for this make/model/year. This is a rough directional signal, not an official rating — fewer reports can also just mean fewer of these vehicles are on the road.</small>
    </div>
  ` : `<small class="hint">Not enough data to estimate a reliability score — a model year is needed to check against NHTSA records.</small>`;
  wrap.innerHTML = `
    ${descHtml}
    ${scoreHtml}
    ${summary && summary.url ? `<div style="margin-top:12px"><a href="${summary.url}" target="_blank" rel="noopener" style="font-size:12px;color:var(--blue)">Read more on Wikipedia →</a></div>` : ''}

}

  if(file.size > 1.5*1024*1024){ showToast('⚠️ File too large — please keep under 1.5MB', 'error'); return; }
  const reader = new FileReader();
  reader.onload = async function(ev){
    const v = getSelected();

function searchDiy(query){
  query = (query||'').toLowerCase().trim();
  if(!query) return [];
  const words = query.split(/\s+/).filter(w=>w.length>2);
  const scored = DIY_GUIDES.map(g=>{
    let score=0;
    g.keywords.forEach(k=>{ if(query.includes(k)) score += k.split(' ').length*3; });
    words.forEach(w=>{ if(g.keywords.some(k=>k.includes(w))) score += 1; if(g.title.toLowerCase().includes(w)) score += 1; });
    return {g, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.map(x=>x.g);
}

/* ============================= CAR VALUE ============================= */
function estimateValue(v, condition, accidents, mods){
  const key = `${(v.make||'').toLowerCase()} ${(v.model||'').toLowerCase()}`.trim();
  let base = DEFAULT_MSRP;
  for(const k in BASE_MSRP){ if(key.includes(k)) { base = BASE_MSRP[k]; break; } }
  const year = parseInt(v.year) || new Date().getFullYear()-5;
  const age = Math.max(new Date().getFullYear() - year, 0);
  let value = base * Math.pow(0.85, age);
  const expectedKm = age * 15000;
  const kmDiff = (v.odometer||0) - expectedKm;
  value -= kmDiff * 0.08;
  const condMult = {excellent:1.05, good:1.0, fair:0.9, poor:0.75}[condition] ?? 1.0;
  value *= condMult;
  const accMult = {none:1.0, minor:0.92, major:0.8}[accidents] ?? 1.0;
  value *= accMult;
  const modMult = {stock:1.0, minor:0.97, heavy:0.9}[mods] ?? 1.0;
  value *= modMult;
  value = Math.max(value, 1500);
  return {min: value*0.9, mid: value, max: value*1.1, base, age};
}
function renderValue(v){
  $('#page-value').innerHTML = `

const typicalSpecsCache = {};
async function autofillSpecsFromWeb(){
  const make = $('#veh-make').value.trim();
  const model = $('#veh-model').value.trim();
  const year = $('#veh-year').value.trim();
  const trim = $('#veh-trim').value.trim();

  const specs = await fetchTypicalSpecs(make, model, year, trim);
  btn.disabled = false; btn.textContent = '✨ Fill in unsure specs';
  if(!specs){
    status.innerHTML = `<span style="color:var(--accent)">⚠️ Couldn't find enough public data for this vehicle — please fill in manually.</span>`;
    return;
  }
  const filled = [];
  const setIfEmpty = (id, label, value) => {
    const el = $(id);
    if(el && !el.value.trim() && value){ el.value = value; filled.push(label); }
  };
  setIfEmpty('#veh-engine', 'Engine', specs.engine);
  setIfEmpty('#veh-transmission', 'Transmission', specs.transmission);
  setIfEmpty('#veh-drivetrain', 'Drivetrain', specs.drivetrain);
  setIfEmpty('#veh-fueltype', 'Fuel Type', specs.fuelType);
  if(filled.length){
    const note = specs.engineNarrowed
      ? `Matched to the ${escapeHtml(specs.engineNarrowed)} variant specifically.`
      : (specs.engineAmbiguous ? `Couldn't pin down your exact variant, so the Engine field lists every option used across this model generation — trim it down to just yours.` : '');
    status.innerHTML = `<span style="color:var(--green)">✓ Filled in ${filled.join(', ')} with typical specs for this model. ${note} Always double-check against your exact vehicle.</span>`;
  } else {
    status.innerHTML = `<span style="color:var(--muted)">Nothing new to fill in — those fields already have values, or no public data was found.</span>`;
  }
}
async function fetchTypicalSpecs(make, model, year, trim){
  const cacheKey = `${year}|${make}|${model}|${trim||''}`.toLowerCase();
  if(typicalSpecsCache[cacheKey] !== undefined) return typicalSpecsCache[cacheKey];
  const queries = [`${year} ${make} ${model}`.trim(), `${make} ${model}`.trim()];
  let content = null;
  for(const q of queries){
    content = await fetchWikipediaWikitext(q);
    if(content) break;
  }
  const trimHint = `${model} ${trim||''}`.trim();
  const result = content ? parseInfoboxSpecs(content, trimHint) : null;
  typicalSpecsCache[cacheKey] = result;
  return result;
}
async function fetchWikipediaWikitext(query){
  if(!query) return null;
  try {
    const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=revisions&rvprop=content&rvslots=main&formatversion=2&format=json&origin=*`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const json = await res.json();
    const pages = json && json.query && json.query.pages;
    if(!pages || !pages.length) return null;
    const rev = pages[0].revisions && pages[0].revisions[0];
    return (rev && rev.slots && rev.slots.main && rev.slots.main.content) || null;
  } catch(e){
    console.error('Wikipedia wikitext fetch failed', e);
    return null;
  }
}
function parseInfoboxSpecs(wikitext, trimHint){
  const openIdx = wikitext.search(/\{\{\s*infobox/i);
  if(openIdx === -1) return null;
  let depth = 0, i = openIdx, end = -1;
  while(i < wikitext.length){
    if(wikitext[i]==='{' && wikitext[i+1]==='{'){ depth++; i+=2; continue; }
    if(wikitext[i]==='}' && wikitext[i+1]==='}'){ depth--; i+=2; if(depth===0){ end = i; break; } continue; }
    i++;
  }
  if(end === -1) return null;
  const inner = wikitext.slice(openIdx+2, end-2);
  const topParts = splitTopLevel(inner, '|');
  const fields = {};
  for(let k=1; k<topParts.length; k++){ // [0] is the template name, e.g. "Infobox automobile"
    const [rawKey, rawVal] = splitTopLevelEquals(topParts[k]);
    const key = rawKey.trim().toLowerCase();
    const val = cleanWikiText(rawVal);
    if(key && val) fields[key] = val;
  }
  const engineRaw = fields['engine'] || fields['powerplant'] || '';
  const transmissionRaw = fields['transmission'] || '';
  const layoutRaw = fields['layout'] || fields['drivetrain'] || '';
  if(!engineRaw && !transmissionRaw && !layoutRaw) return null;
  // Generation/platform articles (e.g. "BMW 3 Series (F30)") often list every engine ever offered
  // across all trims in one infobox field. If the entered Model/Trim contains a specific variant
  // name (e.g. "318i"), try to narrow the list down to just that engine using the article body text
  // (excluding the infobox itself, which would otherwise match every code as "nearby").
  const narrowed = narrowEngineToTrim(engineRaw, wikitext, trimHint, end);
  const engine = narrowed.engine;
  return {
    engine,
    transmission: transmissionRaw,
    drivetrain: mapDrivetrain(layoutRaw),
    fuelType: mapFuelType(engine + ' ' + (fields['fuel'] || fields['fuel_type'] || '')),
    engineNarrowed: narrowed.matchedVariant || null,
    engineAmbiguous: narrowed.ambiguous || false
  };
}
// Given a joined engine list like "1.5 L B38 I3 turbo; 1.6 L N13 I4 turbo; ...", try to find the
// single entry that matches the specific trim the user entered (e.g. "318i"), by looking for that
// trim name near an engine code (e.g. "B38") in the article body text. `infoboxEnd` is excluded from
// the search — the infobox itself contains every code, so proximity there is meaningless.
function narrowEngineToTrim(engineRaw, wikitext, trimHint, infoboxEnd){
  if(!engineRaw) return { engine: engineRaw };
  const items = engineRaw.split(/;\s*/).map(s => s.trim())
    .filter(s => s && !/^(petrol|diesel|electric|hybrid|gasoline)s?:?$/i.test(s));
  if(items.length <= 1) return { engine: engineRaw };
  const candidates = extractTrimCandidates(trimHint);
  if(!candidates.length) return { engine: engineRaw, ambiguous: true };
  const searchFloor = infoboxEnd || 0;
  for(const cand of candidates){
    const trimRe = new RegExp('\\b' + escapeRegex(cand) + '\\b', 'gi');
    let m, best = null, bestDist = Infinity;
    while((m = trimRe.exec(wikitext))){
      if(m.index < searchFloor) continue; // ignore mentions inside/before the infobox itself
      const windowStart = Math.max(searchFloor, m.index - 250), windowEnd = m.index + 250;
      const windowText = wikitext.slice(windowStart, windowEnd);
      for(const item of items){
        const code = extractEngineCode(item);
        if(!code) continue;
        const codeRe = new RegExp('\\b' + escapeRegex(code) + '\\b', 'i');
        const codeMatch = windowText.search(codeRe);
        if(codeMatch !== -1){
          const dist = Math.abs((windowStart + codeMatch) - m.index);
          if(dist < bestDist){ bestDist = dist; best = item; }
        }
      }
    }
    if(best) return { engine: best, matchedVariant: cand };
  }
  return { engine: engineRaw, ambiguous: true };
}
function extractTrimCandidates(text){
  if(!text) return [];
  const matches = text.match(/\b\d{2,3}[a-zA-Z]{1,4}\b/g) || [];
  return [...new Set(matches)].sort((a, b) => b.length - a.length);
}
function extractEngineCode(item){
  const m = item.match(/\b[A-Za-z]{1,3}\d{2,3}[A-Za-z]?\b/);
  return m ? m[0] : null;
}
function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
// Splits text on `delim`, but ignores delimiters that fall inside {{...}} or [[...]] nesting
// (so e.g. "engine = {{Unbulleted list|1.6L I4|2.0L I4}}" isn't torn apart at those inner pipes).
function splitTopLevel(text, delim){
  const parts = []; let depthCurly = 0, depthSquare = 0, start = 0;
  for(let i=0;i<text.length;i++){
    const c = text[i], c2 = text[i+1];
    if(c==='{' && c2==='{'){ depthCurly++; i++; continue; }
    if(c==='}' && c2==='}'){ depthCurly = Math.max(0,depthCurly-1); i++; continue; }
    if(c==='[' && c2==='['){ depthSquare++; i++; continue; }
    if(c===']' && c2===']'){ depthSquare = Math.max(0,depthSquare-1); i++; continue; }
    if(c===delim && depthCurly===0 && depthSquare===0){ parts.push(text.slice(start,i)); start = i+1; }
  }
  parts.push(text.slice(start));
  return parts;
}
// Same nesting-aware idea, but splits at the first top-level "=" only (key = value).
function splitTopLevelEquals(text){
  let depthCurly = 0, depthSquare = 0;
  for(let i=0;i<text.length;i++){
    const c = text[i], c2 = text[i+1];
    if(c==='{' && c2==='{'){ depthCurly++; i++; continue; }
    if(c==='}' && c2==='}'){ depthCurly = Math.max(0,depthCurly-1); i++; continue; }
    if(c==='[' && c2==='['){ depthSquare++; i++; continue; }
    if(c===']' && c2===']'){ depthSquare = Math.max(0,depthSquare-1); i++; continue; }
    if(c==='=' && depthCurly===0 && depthSquare===0){ return [text.slice(0,i), text.slice(i+1)]; }
  }
  return [text, ''];
}
// Recursively resolves {{templates}} and [[links]] into plain text — handles the common
// "list of values" templates Wikipedia infoboxes use (Unbulleted list, plainlist, hlist, convert, etc).
function extractTemplates(text, depthLimit){
  if(depthLimit === undefined) depthLimit = 6;
  if(depthLimit <= 0) return text.replace(/\{\{|\}\}/g, '');
  let result = '', i = 0;
  while(i < text.length){
    const c = text[i], c2 = text[i+1];
    if(c==='{' && c2==='{'){
      let depth = 1, j = i + 2;
      while(j < text.length && depth > 0){
        if(text[j]==='{' && text[j+1]==='{'){ depth++; j+=2; }
        else if(text[j]==='}' && text[j+1]==='}'){ depth--; j+=2; }
        else j++;
      }
      const rawInner = text.slice(i+2, Math.max(i+2, j-2));
      result += renderTemplate(extractTemplates(rawInner, depthLimit-1));
      i = j;
    } else if(c==='[' && c2==='['){
      const close = text.indexOf(']]', i+2);
      if(close === -1){ result += text.slice(i); break; }
      const rawInner = text.slice(i+2, close);
      const parts = splitTopLevel(extractTemplates(rawInner, depthLimit-1), '|');
      result += parts[parts.length-1];
      i = close + 2;
    } else {
      result += c; i++;
    }
  }
  return result;
}
function renderTemplate(inner){
  const parts = splitTopLevel(inner, '|').map(s => s.trim());
  const name = (parts[0]||'').toLowerCase();
  const args = parts.slice(1).filter(a => a && a.indexOf('=') === -1); // drop named params like abbr=on
  if(/^(ubl|unbulleted list|plainlist|hlist|flatlist)$/.test(name)) return args.join('; ');
  if(name === 'convert') return `${args[0]||''} ${args[1]||''}`.trim();
  if(/^(nowrap|nobreak|nb|sortname|small)$/.test(name)) return args.join(' ');
  return ''; // unknown/unrecognized template — drop rather than leak raw markup
}
function cleanWikiText(raw){
  if(!raw) return '';
  let s = raw;
  s = s.replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi, '');
  s = s.replace(/<ref[^>]*\/>/gi, '');
  s = extractTemplates(s);
  s = s.replace(/<br\s*\/?>/gi, '; ');
  s = s.replace(/'''?/g, '');
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/^[:*#]+\s*/, '');
  s = s.replace(/\s*\n\s*/g, '; ');
  s = s.replace(/;\s*;+/g, ';');
  s = s.replace(/^;\s*|;\s*$/g, '');
  s = s.replace(/\s+/g, ' ').trim();
  if(s.length > 140) s = s.slice(0, 137) + '…';
  return s;
}
function mapDrivetrain(text){
  const t = (text||'').toLowerCase();
  if(!t) return '';
  if(t.includes('four-wheel') || t.includes('all-wheel') || /\bawd\b/.test(t) || /\b4wd\b/.test(t)) return 'AWD';
  if(t.includes('front-wheel') || /\bfwd\b/.test(t)) return 'FWD';
  if(t.includes('rear-wheel') || /\brwd\b/.test(t)) return 'RWD';
  return '';
}
function mapFuelType(text){
  const t = (text||'').toLowerCase();
  if(!t.trim()) return '';
  if(t.includes('battery electric') || t.includes('electric motor') || /\bbev\b/.test(t)) return 'Electric';
  if(t.includes('hybrid')) return 'Hybrid';
  if(t.includes('diesel')) return 'Diesel';
  if(t.includes('hydrogen')) return 'Hydrogen';
  return 'Petrol'; // no other fuel type mentioned — default assumption for a described combustion engine
}
async function saveVehicle(editId){
  const data = {
    vin: $('#veh-vin').value.trim(), make: $('#veh-make').value.trim(), model: $('#veh-model').value.trim(),
    year: $('#veh-year').value.trim(), trim: $('#veh-trim').value.trim(), engine: $('#veh-engine').value.trim(),
    transmission: $('#veh-transmission').value.trim(), drivetrain: $('#veh-drivetrain').value.trim(),
    fuelType: $('#veh-fueltype').value.trim(), color: $('#veh-color').value.trim(), plate: $('#veh-plate').value.trim(),
    regState: $('#veh-regstate').value, odometer: parseFloat($('#veh-odometer').value)||0,
    purchaseDate: $('#veh-purchasedate').value || null, purchaseOdometer: $('#veh-purchaseodo').value!=='' ? parseFloat($('#veh-purchaseodo').value) : null,
    odometerDate: today()
  };
  if(!data.make || !data.model){ showToast('⚠️ Please enter at least make and model', 'error'); return; }
  Object.assign(data, lastVinExtra);
  const btn = $('#veh-save-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  if(editId){
    const v = getVehicle(editId);
    const backup = {...v};
    Object.assign(v, data);
    const ok = await saveVehicleToCloud(v);
    if(!ok){ Object.assign(v, backup); if(btn){ btn.disabled=false; btn.textContent='Save Vehicle'; } return; }
  } else {
    const id = newId();
    const v = {...data, id, bodyClass: data.bodyClass||'', plantCountry: data.plantCountry||'', plantCity: data.plantCity||'', manufacturer: data.manufacturer||'', services:[], documents:[]};
    const ok = await saveVehicleToCloud(v);
    if(!ok){ if(btn){ btn.disabled=false; btn.textContent='Save Vehicle'; } return; }
    appState.vehicles.push(v);
    appState.selectedId = v.id;
    saveLocalPrefs();
  }
  closeModal();
  renderAll();
  showToast('✓ Vehicle saved', 'success');
}
async function deleteVehicle(id){
  if(!confirm('Delete this vehicle and all its records? This cannot be undone.')) return;
  const ok = await deleteVehicleFromCloud(id);
  if(!ok) return;
  appState.vehicles = appState.vehicles.filter(v=>v.id!==id);
  if(appState.selectedId===id){ appState.selectedId = appState.vehicles.length ? appState.vehicles[0].id : null; }
  saveLocalPrefs();
  currentPage = 'dashboard';
  renderAll();
  showToast('Vehicle deleted', 'success');
}

/* ============================= MODALS: SERVICE ============================= */
function openServiceModal(prefillType){
  const v = getSelected();
  $('#modal-box').innerHTML = `
    <div class="modal-head"><div class="modal-title">Log Service</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="form-group"><label class="form-label">Service Type</label>
      <select class="form-input" id="svc-type">
        ${SERVICE_INTERVALS.map(s=>`<option value="${s.key}" ${prefillType===s.key?'selected':''}>${s.name}</option>`).join('')}
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group" id="svc-other-wrap" style="display:none"><label class="form-label">Describe Service</label><input class="form-input" id="svc-other-name" placeholder="e.g. Wheel alignment"></div>
    <div class="grid-2" style="gap:0 16px">
      <div class="form-group"><label class="form-label">Odometer (km)</label><input class="form-input" id="svc-odo" value="${v.odometer}"></div>
      <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="svc-date" value="${today()}"></div>
    </div>
    <div class="form-group"><label class="form-label">Workshop / Location</label><input class="form-input" id="svc-shop" placeholder="e.g. VicAuto Fitzroy"></div>
    <div class="form-group"><label class="form-label">Cost ($)</label><input class="form-input" id="svc-cost" placeholder="e.g. 120"></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" rows="2" id="svc-notes" placeholder="Any additional notes..."></textarea></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-primary" style="flex:1" id="svc-save-btn" onclick="saveService('${v.id}')">Save Service</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  `;
  $('#svc-type').addEventListener('change', e=>{ $('#svc-other-wrap').style.display = e.target.value==='other' ? 'block':'none'; });
  if(prefillType==='other') $('#svc-other-wrap').style.display='block';
  openModal();
}
async function saveService(vid){
  const v = getVehicle(vid);
  const typeKey = $('#svc-type').value;
  const interval = SERVICE_INTERVALS.find(s=>s.key===typeKey);
  const typeName = typeKey==='other' ? ($('#svc-other-name').value.trim() || 'Other Service') : interval.name;
  const odo = parseFloat($('#svc-odo').value);
  const date = $('#svc-date').value;
  if(!odo || !date){ showToast('⚠️ Odometer and date are required', 'error'); return; }
  const btn = $('#svc-save-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const prevOdo = v.odometer, prevDate = v.odometerDate;
  const newService = {id: uid('svc'), type: typeKey, typeName, date, odometer: odo, cost: parseFloat($('#svc-cost').value)||0, shop: $('#svc-shop').value.trim(), notes: $('#svc-notes').value.trim()};
  v.services.push(newService);
  if(odo > v.odometer){ v.odometer = odo; v.odometerDate = date; }
  const ok = await saveVehicleToCloud(v);
  if(!ok){
    v.services = v.services.filter(s=>s.id!==newService.id);
    v.odometer = prevOdo; v.odometerDate = prevDate;
    if(btn){ btn.disabled=false; btn.textContent='Save Service'; }
    return;
  }
  closeModal();
  renderAll();
  showToast('✓ Service logged', 'success');
}
/* ============================= MODAL HELPERS ============================= */
function openModal(){ $('#modal-overlay').classList.add('open'); }
function closeModal(){ $('#modal-overlay').classList.remove('open'); }
$('#modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });

/* ============================= CSV EXPORT ============================= */
function exportCsv(){
  const v = getSelected();
  const rows = [['Date','Type','Odometer(km)','Cost','Shop','Notes']];
  v.services.forEach(s=> rows.push([s.date, s.typeName, s.odometer, s.cost, s.shop, s.notes]));
  const filename = `${v.make}_${v.model}_services.csv`;
  const csv = rows.map(r=> r.map(c=> `"${(c??'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ CSV downloaded', 'success');
}
